# 安全响应头。注意：nginx 的 location 一旦自己写了 add_header，就不再继承 server 级的 add_header，
# 所以每个带 add_header 的 location 都要 include 本文件。
# CSP：脚本只允许同源；antd 的 CSS-in-JS 会注入 <style>，因此 style-src 需要 'unsafe-inline'
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "0" always;
